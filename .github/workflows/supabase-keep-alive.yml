
name: Supabase Keep Alive

on:
  schedule:
    # Daily UTC 09:00 (~ Taiwan 17:00)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (read cms_index — matches multi-table CMS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY in repository secrets."
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          # Public SELECT on cms_* per supabase/cms_tables.sql; wakes project + verifies CMS table exists
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${BASE}/rest/v1/cms_index?select=id&limit=1")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Body (truncated): $(echo "$BODY" | head -c 200)"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "OK Supabase project reachable; cms_index query succeeded"
          else
            echo "Unexpected response. Check SUPABASE_URL, SUPABASE_ANON_KEY, and that cms_tables.sql has been applied."
            exit 1
          fi
